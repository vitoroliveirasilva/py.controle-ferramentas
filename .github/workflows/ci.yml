name: ci

on:
  push:
    branches: ["prod", "main", "master"]
  pull_request:
    branches: ["prod", "main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  APP_ENV: testing
  SECRET_KEY: ci-secret-key
  AUTH_DEV_LOGIN_ENABLED: "1"
  NOTIFICATIONS_EMAIL_ENABLED: "0"

jobs:
  quality:
    name: lint-test-migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall -q app tests scripts

      - name: Tests
        run: python -m pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Build Docker image
        run: docker compose build
