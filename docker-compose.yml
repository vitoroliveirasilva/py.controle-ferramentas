services:
  web:
    build:
      context: .
    container_name: controle-ferramentas-web
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UPLOAD_BASE_DIR: ${UPLOAD_BASE_DIR:-/app/instance/uploads}
    ports:
      - "8000:8000"
    command: gunicorn --reload --bind 0.0.0.0:8000 wsgi:application
    volumes:
      - .:/app
      - controle-ferramentas-uploads:/app/instance/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  controle-ferramentas-uploads:
